<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>سلة المشتريات | VOGIC</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cart.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.8/dist/css/intlTelInput.min.css">

</head>

<body>


<header>
    <h1>VOGIC</h1>
    <a href="index.html">العودة للمتجر</a>
</header>

<main class="cart-container">

    <h2>سلة مشترياتكِ</h2>

    <div id="cart-items"></div>

    <div class="cart-total">
        الإجمالي المبدئي:
        <span id="cart-total">0</span> ر.ق
    </div>

    <div class="customer-details">

        <h3>بيانات التواصل</h3>

        <label for="customer-fullname">الاسم الكامل</label>
        <input
            type="text"
            id="customer-fullname"
            placeholder="اكتبي اسمك"
            required
        >


<label for="customer-phone">رقم الجوال</label>

<input
    type="tel"
    id="customer-phone"
    placeholder="أدخل رقم جوالك"
    required
>

        <p class="order-note">
            السعر النهائي وموعد التسليم يتم تأكيدهما عبر واتساب
            قبل اعتماد الطلب والدفع.
        </p>

        <button class="checkout-btn" id="checkout-btn">
            إرسال الطلب عبر واتساب
        </button>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.8/dist/js/intlTelInput.min.js"></script>

<script src="cart.js"></script>
</body>
</html>
